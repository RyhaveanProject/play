<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>ryhavean · Search & Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --spotify-green: #1DB954; --spotify-black: #121212; --text-primary: #FFFFFF; --text-secondary: #B3B3B3; }

        body {
            background: var(--spotify-black);
            color: var(--text-primary);
            font-family: 'Figtree', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .dynamic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, #222 0%, #121212 100%);
            transition: background 0.8s ease;
        }

        .app {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        /* Search Section */
        .search-area { padding: 20px; flex-shrink: 0; }
        .search-box-wrapper { position: relative; }
        .search-box {
            width: 100%;
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
        }
        .search-box:focus { background: rgba(255,255,255,0.15); border-color: var(--spotify-green); }

        /* Results Dropdown */
        .results-list {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            background: #282828;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .result-item:hover { background: #3e3e3e; }
        .result-thumb { width: 40px; height: 40px; border-radius: 4px; }
        .result-info { overflow: hidden; }
        .result-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-artist { font-size: 12px; color: var(--text-secondary); }

        /* Player Section */
        .player-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
        }
        .album-art-container {
            width: 80%;
            aspect-ratio: 1/1;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
        }
        .album-art { width: 100%; height: 100%; object-fit: cover; }
        .song-details { text-align: center; width: 100%; margin-bottom: 25px; }
        .song-details h2 { font-size: 22px; margin-bottom: 5px; }
        .song-details p { color: var(--text-secondary); font-size: 16px; }

        /* Controls */
        .progress-container { width: 100%; margin-bottom: 20px; }
        .bar-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; }
        .bar-fill { width: 0%; height: 100%; background: var(--spotify-green); border-radius: 2px; }
        .time-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }

        .control-btns { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .play-btn { 
            width: 65px; height: 65px; border-radius: 50%; background: white; color: black; 
            display: flex; align-items: center; justify-content: center; border: none; cursor: pointer;
        }
        .play-btn svg { width: 30px; height: 30px; fill: black; }
        .nav-btn { background: none; border: none; color: white; cursor: pointer; }
        .nav-btn svg { width: 35px; height: 35px; fill: currentColor; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="dynamic-bg" id="bgLayer"></div>

    <div class="app">
        <div class="search-area">
            <div class="search-box-wrapper">
                <input type="text" id="searchInput" class="search-box" placeholder="Mahnı adı yazın..." autocomplete="off">
                <div id="resultsDropdown" class="results-list"></div>
            </div>
        </div>

        <div class="player-main">
            <div class="album-art-container">
                <img id="mainArt" class="album-art" src="https://via.placeholder.com/400/282828/FFFFFF?text=Spotify">
            </div>

            <div class="song-details">
                <h2 id="songTitle">Mahnı Axtarın</h2>
                <p id="artistName">ryhavean player</p>
            </div>

            <div class="progress-container">
                <div class="bar-bg" id="progRail">
                    <div class="bar-fill" id="progFill"></div>
                </div>
                <div class="time-info">
                    <span id="curTime">0:00</span>
                    <span id="durTime">0:00</span>
                </div>
            </div>

            <div class="control-btns">
                <button class="nav-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="play-btn" id="playBtn">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="nav-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let searchResults = [];
        let currentIdx = 0;

        const searchInput = document.getElementById('searchInput');
        const resultsDropdown = document.getElementById('resultsDropdown');

        // Axtarış funksiyası
        searchInput.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 2) {
                resultsDropdown.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=10`);
                const data = await response.json();
                renderResults(data.results);
            } catch (err) {
                console.error("Xəta baş verdi", err);
            }
        });

        function renderResults(results) {
            if (results.length === 0) {
                resultsDropdown.style.display = 'none';
                return;
            }

            searchResults = results.map(item => ({
                title: item.trackName,
                artist: item.artistName,
                cover: item.artworkUrl100.replace('100x100', '600x600'),
                preview: item.previewUrl
            }));

            resultsDropdown.innerHTML = searchResults.map((song, index) => `
                <div class="result-item" onclick="selectSong(${index})">
                    <img src="${song.cover}" class="result-thumb">
                    <div class="result-info">
                        <div class="result-name">${song.title}</div>
                        <div class="result-artist">${song.artist}</div>
                    </div>
                </div>
            `).join('');
            
            resultsDropdown.style.display = 'block';
        }

        function selectSong(index) {
            currentIdx = index;
            const song = searchResults[index];
            
            audio.src = song.preview;
            document.getElementById('mainArt').src = song.cover;
            document.getElementById('songTitle').textContent = song.title;
            document.getElementById('artistName').textContent = song.artist;
            
            resultsDropdown.style.display = 'none';
            searchInput.value = song.title;

            const hue = Math.floor(Math.random() * 360);
            document.getElementById('bgLayer').style.background = `linear-gradient(180deg, hsl(${hue}, 40%, 25%) 0%, #121212 100%)`;

            audio.play();
            updatePlayIcon(true);
        }

        function updatePlayIcon(isPlaying) {
            document.getElementById('playIcon').classList.toggle('hidden', isPlaying);
            document.getElementById('pauseIcon').classList.toggle('hidden', !isPlaying);
        }

        document.getElementById('playBtn').onclick = () => {
            if (audio.src) {
                if (audio.paused) { audio.play(); updatePlayIcon(true); }
                else { audio.pause(); updatePlayIcon(false); }
            }
        };

        // Progress Bar
        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progFill').style.width = (pct || 0) + '%';
            document.getElementById('curTime').textContent = formatTime(audio.currentTime);
            document.getElementById('durTime').textContent = formatTime(audio.duration);
        };

        function formatTime(secs) {
            if (isNaN(secs)) return "0:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Siyahıdan kənara kliklədikdə axtarış bağlansın
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box-wrapper')) {
                resultsDropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
