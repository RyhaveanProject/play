<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ryhavean · pleyer</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Figtree', sans-serif; }
        body { background: #121212; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Axtarış Bölməsi */
        .search-area { padding: 20px; position: relative; z-index: 100; }
        .search-bar { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; background: #282828; color: white; outline: none; font-size: 16px; }
        .results { position: absolute; top: 75px; left: 20px; right: 20px; background: #282828; border-radius: 10px; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        .item img { width: 40px; height: 40px; border-radius: 4px; }
        .item-info { font-size: 13px; overflow: hidden; }
        .item-title { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Pleyer Bölməsi */
        .player { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .cover { width: 280px; height: 280px; border-radius: 15px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); margin-bottom: 30px; object-fit: cover; background: #222; }
        .title { font-size: 24px; font-weight: 900; margin-bottom: 8px; width: 100%; overflow: hidden; text-overflow: ellipsis; }
        .artist { color: #b3b3b3; font-size: 16px; margin-bottom: 30px; }

        /* İdarəetmə Paneli */
        .progress-box { width: 100%; margin-bottom: 20px; }
        .bar { width: 100%; height: 5px; background: #444; border-radius: 5px; cursor: pointer; position: relative; }
        .fill { width: 0%; height: 100%; background: #1DB954; border-radius: 5px; }
        .controls { display: flex; align-items: center; gap: 40px; }
        .btn { background: none; border: none; cursor: pointer; fill: white; }
        .play-btn { width: 65px; height: 65px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; fill: black; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="search-area">
        <input type="text" id="inp" class="search-bar" placeholder="Mahnı adı yaz...">
        <div id="res" class="results"></div>
    </div>

    <div class="player">
        <img id="art" class="cover" src="https://via.placeholder.com/300/222/555?text=Musiqi">
        <div id="name" class="title">Seçim edin</div>
        <div id="auth" class="artist">Pleyer hazırdır</div>

        <div class="progress-box">
            <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
        </div>

        <div class="controls">
            <button class="btn" onclick="prev()"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
            <button class="btn play-btn" id="pBtn">
                <svg id="icon-p" width="35" height="35" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-s" class="hidden" width="35" height="35" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="btn" onclick="next()"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
    </div>

    <script>
        let list = [], cur = 0;
        const audio = new Audio();
        const inp = document.getElementById('inp');
        const resBox = document.getElementById('res');

        // Axtarış funksiyası
        async function search(q) {
            if(!q) return;
            resBox.innerHTML = '<div style="padding:15px;text-align:center">Axtarılır...</div>';
            resBox.style.display = 'block';
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=10`);
                const data = await response.json();
                resBox.innerHTML = '';
                data.results.forEach(m => {
                    const d = document.createElement('div');
                    d.className = 'item';
                    d.innerHTML = `<img src="${m.artworkUrl60}"><div class="item-info"><div class="item-title">${m.trackName}</div><div style="color:#b3b3b3">${m.artistName}</div></div>`;
                    d.onclick = () => {
                        const track = { n: m.trackName, a: m.artistName, i: m.artworkUrl100.replace('100x100', '600x600'), u: m.previewUrl };
                        list.push(track);
                        cur = list.length - 1;
                        setup(cur);
                        resBox.style.display = 'none';
                        inp.value = '';
                    };
                    resBox.appendChild(d);
                });
            } catch (e) { resBox.innerHTML = '<div style="padding:15px;color:red">İnternet xətası</div>'; }
        }

        let timer;
        inp.oninput = () => {
            clearTimeout(timer);
            timer = setTimeout(() => search(inp.value), 600);
        };

        function setup(i) {
            const t = list[i];
            audio.src = t.u;
            document.getElementById('art').src = t.i;
            document.getElementById('name').innerText = t.n;
            document.getElementById('auth').innerText = t.a;
            audio.load();
            playPause(true); // Seçən kimi çalmağa çalışır
        }

        function playPause(forcePlay = false) {
            if(forcePlay || audio.paused) {
                audio.play().then(() => {
                    document.getElementById('icon-p').classList.add('hidden');
                    document.getElementById('icon-s').classList.remove('hidden');
                }).catch(() => {
                    // Əgər brauzer bloklasa, düyməni "Play" vəziyyətində saxla
                    document.getElementById('icon-p').classList.remove('hidden');
                    document.getElementById('icon-s').classList.add('hidden');
                });
            } else {
                audio.pause();
                document.getElementById('icon-p').classList.remove('hidden');
                document.getElementById('icon-s').classList.add('hidden');
            }
        }

        document.getElementById('pBtn').onclick = () => playPause();
        function next() { if(list.length > 1) { cur = (cur + 1) % list.length; setup(cur); } }
        function prev() { if(list.length > 1) { cur = (cur - 1 + list.length) % list.length; setup(cur); } }

        audio.ontimeupdate = () => {
            const p = (audio.currentTime / audio.duration) * 100;
            document.getElementById('fill').style.width = p + '%';
        };

        document.getElementById('bar').onclick = (e) => {
            const w = document.getElementById('bar').clientWidth;
            const x = e.offsetX;
            audio.currentTime = (x / w) * audio.duration;
        };

        audio.onended = () => next();
        document.onclick = (e) => { if(!e.target.closest('.search-area')) resBox.style.display = 'none'; };
    </script>
</body>
</html>
