<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>ryhavean · spotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --spotify-red: #e91429;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--spotify-black);
            color: var(--text-primary);
            font-family: 'Figtree', sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .dynamic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, #333 0%, #121212 100%);
            transition: background 1s ease;
        }

        .app {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ── Search Styles ── */
        .search-container {
            padding: 12px 20px 5px;
            position: relative;
            z-index: 10;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            font-family: inherit;
            outline: none;
            font-size: 14px;
            transition: background 0.25s, box-shadow 0.25s;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.14);
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.25);
        }
        .search-input::placeholder { color: rgba(255,255,255,0.35); }
        .search-icon {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            pointer-events: none;
            font-size: 16px;
        }
        .search-results {
            position: absolute;
            top: 58px;
            left: 20px;
            right: 20px;
            background: #282828;
            border-radius: 12px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .search-results::-webkit-scrollbar { width: 4px; }
        .search-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .search-item:hover { background: rgba(255,255,255,0.08); }
        .search-item img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
        .search-item-info { overflow: hidden; flex: 1; min-width: 0; }
        .search-item-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-item-artist { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .top-bar { display: flex; align-items: center; justify-content: center; padding: 8px 20px; flex-shrink: 0; }
        .header-profile { display: flex; align-items: center; gap: 10px; }
        .profile-img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); }
        .creator-info { font-size: 10px; color: var(--text-secondary); text-transform: lowercase; letter-spacing: 0.5px; }

        .main-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 30px; min-height: 0; }
        .album-cover-container { width: 100%; aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.6); background: #222; }
        .album-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .song-info-row { display: flex; align-items: center; justify-content: space-between; margin-top: 25px; }
        .song-title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .like-wrapper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .heart-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; transition: 0.2s; padding: 0; display: flex; align-items: center; }
        .heart-btn.liked { color: var(--spotify-red); }
        .heart-btn svg { width: 26px; height: 26px; fill: currentColor; }

        .controls-wrapper { margin-top: 20px; }
        .progress-rail { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; position: relative; }
        .progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }
        .time-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-top: 8px; }

        .btns-row { display: flex; align-items: center; justify-content: space-between; margin-top: 15px; }
        .c-btn { background: none; border: none; color: #fff; cursor: pointer; opacity: 0.7; }
        .c-btn svg { width: 28px; height: 28px; fill: currentColor; }
        .play-btn { width: 60px; height: 60px; border-radius: 50%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; }
        .play-btn svg { fill: #000; width: 28px; height: 28px; }

        .playlist-section { padding: 20px 0; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5)); margin-top: auto; }
        .list-header { padding: 0 24px 12px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
        .playlist-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 24px; scrollbar-width: none; }
        .list-item { flex: 0 0 90px; cursor: pointer; }
        .item-thumb { width: 90px; height: 90px; border-radius: 6px; object-fit: cover; opacity: 0.4; transition: 0.3s; }
        .list-item.active .item-thumb { opacity: 1; border: 2px solid var(--spotify-green); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="dynamic-bg" id="bgLayer"></div>

    <div class="app">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="YouTube-da axtar..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>

        <header class="top-bar">
            <div class="header-profile">
                <img class="profile-img" src="https://i.ibb.co/DfTfD2wV/MG-0476.png" alt="profile">
                <div class="creator-info">creator <b>@ryhavean</b></div>
            </div>
        </header>

        <main class="main-content">
            <div class="album-cover-container">
                <img id="mainArt" class="album-img" src="https://via.placeholder.com/400/282828/FFFFFF?text=ryhavean" alt="album art">
            </div>

            <div class="song-info-row">
                <div class="song-info" style="overflow:hidden;">
                    <div class="song-title" id="songTitle">Mahnı seçilməyib</div>
                    <div class="artist-name" id="artistName">Axtarış edin</div>
                </div>
                <div class="like-wrapper">
                    <button class="heart-btn" id="heartBtn">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.27 2 8.5 2 5.41 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.41 22 8.5c0 3.77-3.4 6.86-8.55 11.53L12 21.35z"/></svg>
                    </button>
                </div>
            </div>

            <div class="controls-wrapper">
                <div class="progress-rail" id="progRail"><div class="progress-fill" id="progFill"></div></div>
                <div class="time-labels"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
                <div class="btns-row">
                    <button class="c-btn"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 11.41l-1.41 1.41 3.13 3.13L14.5 22H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                    <button class="c-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="c-btn play-btn" id="playBtn">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="c-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    <button class="c-btn"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
                </div>
            </div>
        </main>

        <div class="playlist-section">
            <div class="list-header">Sıradakı mahnılar</div>
            <div class="playlist-scroll" id="scrollContainer"></div>
        </div>
    </div>

    <script>
        let currentQueue = [], currentIdx = 0;
        const audio = new Audio();
        const searchInput = document.getElementById('searchInput');
        const searchResultsDiv = document.getElementById('searchResults');
        
        // --- YouTube (Invidious/Piped) Search Logic ---
        async function performSearch(query) {
            searchResultsDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#B3B3B3;">Axtarılır...</div>';
            searchResultsDiv.style.display = 'block';
            try {
                // Stabil YouTube Proxy API
                const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                const data = await res.json();
                
                if (!data.items || data.items.length === 0) {
                    searchResultsDiv.innerHTML = '<div style="padding:20px; text-align:center;">Nəticə tapılmadı.</div>';
                    return;
                }
                
                searchResultsDiv.innerHTML = '';
                data.items.slice(0, 10).forEach(item => {
                    const videoId = item.url.split('=')[1];
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `
                        <img src="${item.thumbnail}">
                        <div class="search-item-info">
                            <div class="search-item-title">${item.title}</div>
                            <div class="search-item-artist">${item.uploaderName}</div>
                        </div>`;
                    div.onclick = () => {
                        const track = { id: videoId, title: item.title, artist: item.uploaderName, cover: item.thumbnail };
                        addToQueueAndPlay(track);
                        searchResultsDiv.style.display = 'none';
                        searchInput.value = '';
                    };
                    searchResultsDiv.appendChild(div);
                });
            } catch (err) {
                searchResultsDiv.innerHTML = '<div style="padding:20px; text-align:center; color:red;">Bağlantı xətası.</div>';
            }
        }

        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            if (e.target.value.length < 2) return searchResultsDiv.style.display = 'none';
            searchTimeout = setTimeout(() => performSearch(e.target.value), 500);
        });

        function addToQueueAndPlay(track) {
            if (!currentQueue.find(t => t.id === track.id)) currentQueue.push(track);
            currentIdx = currentQueue.findIndex(t => t.id === track.id);
            loadTrack(currentIdx);
        }

        function loadTrack(idx) {
            const track = currentQueue[idx];
            // Stabil YouTube Audio Stream Server
            audio.src = `https://invidious.sethforprivacy.com/latest_version?id=${track.id}&itag=140`;
            document.getElementById('mainArt').src = track.cover;
            document.getElementById('songTitle').textContent = track.title;
            document.getElementById('artistName').textContent = track.artist;
            audio.play().then(() => syncPlay(true)).catch(() => syncPlay(false));
            renderQueue();
            updateBG(idx);
        }

        function renderQueue() {
            const scroll = document.getElementById('scrollContainer');
            scroll.innerHTML = '';
            currentQueue.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `list-item ${i === currentIdx ? 'active' : ''}`;
                item.innerHTML = `<img class="item-thumb" src="${t.cover}">`;
                item.onclick = () => loadTrack(i);
                scroll.appendChild(item);
            });
        }

        function syncPlay(isP) {
            document.getElementById('playIcon').classList.toggle('hidden', isP);
            document.getElementById('pauseIcon').classList.toggle('hidden', !isP);
        }

        document.getElementById('playBtn').onclick = () => audio.paused ? (audio.play(), syncPlay(true)) : (audio.pause(), syncPlay(false));
        document.getElementById('nextBtn').onclick = () => currentQueue.length > 1 && loadTrack((currentIdx + 1) % currentQueue.length);
        document.getElementById('prevBtn').onclick = () => currentQueue.length > 1 && loadTrack((currentIdx - 1 + currentQueue.length) % currentQueue.length);

        audio.ontimeupdate = () => {
            document.getElementById('progFill').style.width = (audio.currentTime / audio.duration * 100 || 0) + '%';
            document.getElementById('curTime').textContent = fmt(audio.currentTime);
        };
        audio.onloadedmetadata = () => document.getElementById('durTime').textContent = fmt(audio.duration);
        audio.onended = () => document.getElementById('nextBtn').click();

        function fmt(s) { const m = Math.floor(s/60); const ss = Math.floor(s%60); return m+":"+(ss<10?"0":"")+ss; }
        function updateBG(idx) { document.getElementById('bgLayer').style.background = `linear-gradient(180deg, hsl(${(idx*137)%360}, 20%, 20%) 0%, #121212 100%)`; }

        document.addEventListener('click', e => { if (!e.target.closest('.search-container')) searchResultsDiv.style.display = 'none'; });
    </script>
</body>
</html>
