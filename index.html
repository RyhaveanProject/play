<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>ryhavean · spotify</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --spotify-green: #1DB954; --spotify-black: #121212; --text-primary: #FFFFFF; --text-secondary: #B3B3B3; }
        body { background: var(--spotify-black); color: var(--text-primary); font-family: 'Figtree', sans-serif; height: 100vh; overflow: hidden; }
        
        .dynamic-bg { position: fixed; inset: 0; background: linear-gradient(180deg, #333 0%, #121212 100%); z-index: 0; transition: 1s; }
        .app { position: relative; z-index: 1; max-width: 400px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }

        .search-container { padding: 15px 20px; }
        .search-input { width: 100%; padding: 12px 40px; border-radius: 25px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; }
        .results-box { position: absolute; top: 65px; left: 20px; right: 20px; background: #282828; border-radius: 10px; max-height: 300px; overflow-y: auto; display: none; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-item { display: flex; align-items: center; gap: 12px; padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .search-item img { width: 45px; height: 45px; border-radius: 4px; }
        .search-item-info { overflow: hidden; }
        .search-item-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 30px; text-align: center; }
        .art-box { width: 100%; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 50px rgba(0,0,0,0.6); margin-bottom: 30px; }
        .art-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .song-title { font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .artist-name { color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }

        .progress-container { width: 100%; margin-bottom: 20px; }
        .rail { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; cursor: pointer; }
        .fill { height: 100%; background: #fff; width: 0%; border-radius: 2px; }
        .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-top: 8px; }

        .controls { display: flex; justify-content: space-between; align-items: center; }
        .btn { background: none; border: none; cursor: pointer; fill: white; opacity: 0.8; }
        .play-btn { width: 65px; height: 65px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; fill: black; opacity: 1; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="dynamic-bg" id="bg"></div>
    <div class="app">
        <div class="search-container">
            <input type="text" id="search" class="search-input" placeholder="Mahnı axtar...">
            <div id="results" class="results-box"></div>
        </div>

        <div class="player-main">
            <div class="art-box"><img id="mainArt" src="https://via.placeholder.com/400/222/555?text=ryhavean"></div>
            <div class="song-title" id="title">Hazırsan?</div>
            <div class="artist-name" id="artist">Axtarış bölməsindən mahnı seç</div>

            <div class="progress-container">
                <div class="rail" id="rail"><div class="fill" id="fill"></div></div>
                <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
            </div>

            <div class="controls">
                <button class="btn" id="prev"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="btn play-btn" id="play">
                    <svg id="p-on" width="30" height="30" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="p-off" class="hidden" width="30" height="30" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn" id="next"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
            </div>
        </div>
    </div>

    <script>
        let playlist = [], index = 0;
        const audio = new Audio();
        const searchInput = document.getElementById('search');
        const resultsBox = document.getElementById('results');

        // Proxy vasitəsilə stabil axtarış
        async function search(q) {
            resultsBox.innerHTML = '<div style="padding:15px;text-align:center;">Gözləyin...</div>';
            resultsBox.style.display = 'block';
            try {
                // AllOrigins proxy istifadə edərək bloklamanı keçirik
                const url = encodeURIComponent(`https://itunes.apple.com/search?term=${q}&media=music&limit=10`);
                const res = await fetch(`https://api.allorigins.win/get?url=${url}`);
                const json = await res.json();
                const data = JSON.parse(json.contents);
                
                resultsBox.innerHTML = '';
                data.results.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<img src="${item.artworkUrl60}"><div class="search-item-info"><div class="search-item-title">${item.trackName}</div><div style="font-size:11px;color:#B3B3B3">${item.artistName}</div></div>`;
                    div.onclick = () => {
                        const track = { 
                            title: item.trackName, 
                            artist: item.artistName, 
                            art: item.artworkUrl100.replace('100x100', '600x600'), 
                            url: item.previewUrl 
                        };
                        playlist.push(track);
                        index = playlist.length - 1;
                        playTrack(index);
                        resultsBox.style.display = 'none';
                        searchInput.value = '';
                    };
                    resultsBox.appendChild(div);
                });
            } catch (err) { resultsBox.innerHTML = '<div style="padding:15px;color:red;">Xəta! Yenidən yoxlayın.</div>'; }
        }

        let tOut;
        searchInput.oninput = (e) => {
            clearTimeout(tOut);
            if(e.target.value.length < 2) return resultsBox.style.display = 'none';
            tOut = setTimeout(() => search(e.target.value), 500);
        };

        function playTrack(i) {
            const track = playlist[i];
            audio.src = track.url;
            document.getElementById('mainArt').src = track.art;
            document.getElementById('title').textContent = track.title;
            document.getElementById('artist').textContent = track.artist;
            audio.play().catch(e => console.log("Click play to start"));
            toggleBtn(true);
            document.getElementById('bg').style.background = `linear-gradient(180deg, hsl(${(i*137)%360}, 25%, 25%) 0%, #121212 100%)`;
        }

        function toggleBtn(isP) {
            document.getElementById('p-on').classList.toggle('hidden', isP);
            document.getElementById('p-off').classList.toggle('hidden', !isP);
        }

        document.getElementById('play').onclick = () => {
            if(!audio.src) return;
            audio.paused ? (audio.play(), toggleBtn(true)) : (audio.pause(), toggleBtn(false));
        };

        document.getElementById('next').onclick = () => playlist.length && playTrack((index + 1) % playlist.length);
        document.getElementById('prev').onclick = () => playlist.length && playTrack((index - 1 + playlist.length) % playlist.length);

        audio.ontimeupdate = () => {
            document.getElementById('fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
            document.getElementById('cur').textContent = fmt(audio.currentTime);
        };
        audio.onloadedmetadata = () => document.getElementById('dur').textContent = fmt(audio.duration);
        audio.onended = () => document.getElementById('next').click();

        function fmt(s) { const m = Math.floor(s/60); const ss = Math.floor(s%60); return m+":"+(ss<10?"0":"")+ss; }
        document.onclick = (e) => { if(!e.target.closest('.search-container')) resultsBox.style.display = 'none'; };
    </script>
</body>
</html>
