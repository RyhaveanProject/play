<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>ryhavean · Live Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --spotify-red: #e91429;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--spotify-black);
            color: var(--text-primary);
            font-family: 'Figtree', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .dynamic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, #333 0%, #121212 100%);
            transition: background 1s ease;
        }

        .app {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
        }

        /* Axtarış Hissəsi */
        .search-container {
            padding: 15px 20px;
            z-index: 10;
        }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .search-box:focus {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px rgba(29, 185, 84, 0.3);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            flex-shrink: 0;
        }
        .header-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }
        .creator-info {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: lowercase;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 30px;
            min-height: 0;
        }

        .album-cover-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            background: #282828;
        }
        .album-img { width: 100%; height: 100%; object-fit: cover; }

        .song-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
        }
        .song-title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        .artist-name { font-size: 14px; color: var(--text-secondary); display: block; }

        .controls-wrapper { margin-top: 20px; }
        .progress-rail {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px; cursor: pointer;
        }
        .progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; }
        .time-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-secondary); margin-top: 8px;
        }

        .btns-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 15px;
        }
        .c-btn { background: none; border: none; color: #fff; cursor: pointer; }
        .c-btn svg { width: 28px; height: 28px; fill: currentColor; }
        .play-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center;
        }
        .play-btn svg { fill: #000; width: 28px; height: 28px; }

        .playlist-section {
            padding: 20px 0;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
            margin-top: auto;
        }
        .list-header { padding: 0 24px 12px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
        .playlist-scroll {
            display: flex; gap: 12px; overflow-x: auto;
            padding: 0 24px; scrollbar-width: none;
        }
        .playlist-scroll::-webkit-scrollbar { display: none; }
        .list-item { flex: 0 0 90px; cursor: pointer; position: relative; }
        .item-thumb { 
            width: 90px; height: 90px; border-radius: 6px; 
            object-fit: cover; opacity: 0.6; transition: 0.3s;
        }
        .list-item.active .item-thumb { opacity: 1; transform: scale(1.05); border: 2px solid var(--spotify-green); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="dynamic-bg" id="bgLayer"></div>

    <div class="app">
        <header class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Mahnı və ya müğənni axtar...">
        </header>

        <header class="top-bar">
            <div class="header-profile">
                <img class="profile-img" src="https://i.ibb.co/DfTfD2wV/MG-0476.png">
                <div class="creator-info">live player <b>@ryhavean</b></div>
            </div>
        </header>

        <main class="main-content">
            <div class="album-cover-container">
                <img id="mainArt" class="album-img" src="https://via.placeholder.com/400/121212/FFFFFF?text=Axtarış+Et">
            </div>

            <div class="song-info-row">
                <div class="song-info">
                    <div class="song-title" id="songTitle">Mahnı seçilməyib</div>
                    <span class="artist-name" id="artistName">Axtarış hissəsindən yazın</span>
                </div>
            </div>

            <div class="controls-wrapper">
                <div class="progress-rail" id="progRail">
                    <div class="progress-fill" id="progFill"></div>
                </div>
                <div class="time-labels">
                    <span id="curTime">0:00</span>
                    <span id="durTime">0:00</span>
                </div>

                <div class="btns-row">
                    <button class="c-btn"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 11.41l-1.41 1.41 3.13 3.13L14.5 22H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                    <button class="c-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="c-btn play-btn" id="playBtn">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="c-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    <button class="c-btn"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
                </div>
            </div>
        </main>

        <div class="playlist-section">
            <div class="list-header">Son axtarışlar</div>
            <div class="playlist-scroll" id="scrollContainer"></div>
        </div>
    </div>

    <script>
        let searchResults = [];
        let currentIdx = 0;
        const audio = new Audio();
        const searchInput = document.getElementById('searchInput');

        // Axtarış funksiyası (iTunes API istifadə edir - Pulsuzdur)
        async function searchSongs(query) {
            if(!query) return;
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`);
                const data = await response.json();
                
                if(data.results.length > 0) {
                    searchResults = data.results.map(item => ({
                        title: item.trackName,
                        artist: item.artistName,
                        cover: item.artworkUrl100.replace('100x100', '600x600'),
                        preview: item.previewUrl
                    }));
                    currentIdx = 0;
                    loadTrack(0);
                    updateList();
                }
            } catch (error) {
                console.error("Axtarış xətası:", error);
            }
        }

        searchInput.onkeypress = (e) => {
            if(e.key === 'Enter') {
                searchSongs(searchInput.value);
            }
        };

        function loadTrack(idx) {
            if(!searchResults[idx]) return;
            const track = searchResults[idx];
            
            audio.src = track.preview;
            document.getElementById('mainArt').src = track.cover;
            document.getElementById('songTitle').textContent = track.title;
            document.getElementById('artistName').textContent = track.artist;
            
            updateBg();
            sync(false);
            audio.play().then(() => sync(true)).catch(e => console.log("Gözlənilir..."));
        }

        function updateBg() {
            const hue = (currentIdx * 45) % 360;
            document.getElementById('bgLayer').style.background = `linear-gradient(180deg, hsl(${hue}, 30%, 20%) 0%, #121212 100%)`;
        }

        function updateList() {
            const container = document.getElementById('scrollContainer');
            container.innerHTML = '';
            searchResults.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `list-item ${i === currentIdx ? 'active' : ''}`;
                item.innerHTML = `<img class="item-thumb" src="${t.cover}">`;
                item.onclick = () => { currentIdx = i; loadTrack(i); };
                container.appendChild(item);
            });
        }

        function sync(p) {
            document.getElementById('playIcon').classList.toggle('hidden', p);
            document.getElementById('pauseIcon').classList.toggle('hidden', !p);
        }

        document.getElementById('playBtn').onclick = () => {
            if (audio.paused) { audio.play(); sync(true); }
            else { audio.pause(); sync(false); }
        };

        document.getElementById('nextBtn').onclick = () => {
            if(searchResults.length === 0) return;
            currentIdx = (currentIdx + 1) % searchResults.length;
            loadTrack(currentIdx);
        };

        document.getElementById('prevBtn').onclick = () => {
            if(searchResults.length === 0) return;
            currentIdx = (currentIdx - 1 + searchResults.length) % searchResults.length;
            loadTrack(currentIdx);
        };

        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            document.getElementById('progFill').style.width = (pct || 0) + '%';
            document.getElementById('curTime').textContent = Math.floor(audio.currentTime / 60) + ":" + ("0" + Math.floor(audio.currentTime % 60)).slice(-2);
        };

        audio.onloadedmetadata = () => {
            document.getElementById('durTime').textContent = Math.floor(audio.duration / 60) + ":" + ("0" + Math.floor(audio.duration % 60)).slice(-2);
        };

        audio.onended = () => document.getElementById('nextBtn').click();

        // İlkin nümunə axtarış (Populyar mahnılar üçün)
        searchSongs("Trending");
    </script>
</body>
</html>
