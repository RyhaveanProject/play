<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#121212" />
    <title>ryhavean · spotify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --spotify-green: #1DB954;
            --spotify-black: #121212;
            --spotify-red: #e91429;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--spotify-black);
            color: var(--text-primary);
            font-family: 'Figtree', sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        .dynamic-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(180deg, #333 0%, #121212 100%);
            transition: background 1s ease;
        }

        .app {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: 0 auto;
        }

        /* ── Search Styles (Spotify gibi) ── */
        .search-container {
            padding: 12px 20px 5px;
            position: relative;
            z-index: 10;
        }
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 20px;
            border: none;
            background: rgba(255,255,255,0.08);
            color: white;
            font-family: inherit;
            outline: none;
            font-size: 14px;
            transition: background 0.25s, box-shadow 0.25s;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.14);
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.25);
        }
        .search-input::placeholder { color: rgba(255,255,255,0.35); }
        .search-icon {
            position: absolute;
            left: 32px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.35);
            pointer-events: none;
            font-size: 16px;
        }
        .search-results {
            position: absolute;
            top: 58px;
            left: 20px;
            right: 20px;
            background: #282828;
            border-radius: 12px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .search-results::-webkit-scrollbar { width: 4px; }
        .search-results::-webkit-scrollbar-track { background: transparent; }
        .search-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .search-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background: rgba(255,255,255,0.08); }
        .search-item img {
            width: 44px; height: 44px; border-radius: 4px; object-fit: cover;
            flex-shrink: 0;
        }
        .search-item-info { overflow: hidden; flex: 1; min-width: 0; }
        .search-item-title {
            font-size: 14px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .search-item-artist {
            font-size: 12px; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .search-item-badge {
            font-size: 11px;
            color: var(--spotify-green);
            background: rgba(29,185,84,0.12);
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            font-weight: 600;
            flex-shrink: 0;
        }
        .search-loading, .search-error, .search-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .search-error { color: #f15e5e; }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            flex-shrink: 0;
        }
        .header-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .creator-info {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 30px;
            min-height: 0;
        }

        .album-cover-container {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            background: #222;
        }
        .album-img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .song-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 25px;
        }
        .song-info { overflow: hidden; margin-right: 10px; }
        .song-title { font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .like-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .heart-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            padding: 0;
            display: flex;
            align-items: center;
        }
        .heart-btn.liked { color: var(--spotify-red); }
        .heart-btn:hover { transform: scale(1.1); }
        .heart-btn.liked:hover { transform: scale(1.1); }
        .heart-btn svg { width: 26px; height: 26px; fill: currentColor; }
        .like-count {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 10px;
        }

        .controls-wrapper { margin-top: 20px; }
        .progress-rail {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px; cursor: pointer;
            position: relative;
        }
        .progress-rail:hover .progress-fill { background: var(--spotify-green); }
        .progress-fill { height: 100%; width: 0%; background: #fff; border-radius: 2px; transition: width 0.15s linear; }
        .time-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-secondary); margin-top: 8px;
        }

        .btns-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 15px;
        }
        .c-btn { background: none; border: none; color: #fff; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
        .c-btn:hover { opacity: 1; }
        .c-btn svg { width: 28px; height: 28px; fill: currentColor; }
        .play-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: #fff; color: #000;
            display: flex; align-items: center; justify-content: center;
            opacity: 1 !important;
            transition: transform 0.15s;
        }
        .play-btn:hover { transform: scale(1.04); }
        .play-btn svg { fill: #000; width: 28px; height: 28px; }

        .playlist-section {
            padding: 20px 0;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
            margin-top: auto;
        }
        .list-header { padding: 0 24px 12px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .playlist-scroll {
            display: flex; gap: 12px; overflow-x: auto;
            padding: 0 24px; scrollbar-width: none;
        }
        .playlist-scroll::-webkit-scrollbar { display: none; }
        .list-item { flex: 0 0 90px; cursor: pointer; transition: transform 0.2s; }
        .list-item:hover { transform: translateY(-2px); }
        .item-thumb { 
            width: 90px; height: 90px; border-radius: 6px; 
            object-fit: cover; opacity: 0.4; transition: 0.3s;
        }
        .list-item.active .item-thumb { opacity: 1; transform: scale(1.05); border: 2px solid var(--spotify-green); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="dynamic-bg" id="bgLayer"></div>

    <div class="app">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Mahnı, müğənni axtar..." autocomplete="off">
            <div id="searchResults" class="search-results"></div>
        </div>

        <header class="top-bar">
            <div class="header-profile">
                <img class="profile-img" src="https://i.ibb.co/DfTfD2wV/MG-0476.png" alt="profile">
                <div class="creator-info">creator <b>@ryhavean</b></div>
            </div>
        </header>

        <main class="main-content">
            <div class="album-cover-container">
                <img id="mainArt" class="album-img" src="https://via.placeholder.com/400/282828/FFFFFF?text=ryhavean" alt="album art">
            </div>

            <div class="song-info-row">
                <div class="song-info">
                    <div class="song-title" id="songTitle">Mahnı seçilməyib</div>
                    <div class="artist-name" id="artistName">Axtarış edin</div>
                </div>
                <div class="like-wrapper">
                    <span class="like-count" id="likeCount">0</span>
                    <button class="heart-btn" id="heartBtn">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.27 2 8.5 2 5.41 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.41 22 8.5c0 3.77-3.4 6.86-8.55 11.53L12 21.35z"/></svg>
                    </button>
                </div>
            </div>

            <div class="controls-wrapper">
                <div class="progress-rail" id="progRail">
                    <div class="progress-fill" id="progFill"></div>
                </div>
                <div class="time-labels">
                    <span id="curTime">0:00</span>
                    <span id="durTime">0:00</span>
                </div>

                <div class="btns-row">
                    <button class="c-btn" id="shuffleBtn"><svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 11.41l-1.41 1.41 3.13 3.13L14.5 22H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                    <button class="c-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                    <button class="c-btn play-btn" id="playBtn">
                        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button class="c-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                    <button class="c-btn" id="repeatBtn"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
                </div>
            </div>
        </main>

        <div class="playlist-section">
            <div class="list-header">Sıradakı mahnılar</div>
            <div class="playlist-scroll" id="scrollContainer"></div>
        </div>
    </div>

    <script>
        // ─── State ──────────────────────────────────────────────────────────
        let currentQueue = [];
        let currentIdx = 0;
        const audio = new Audio();
        const NAMESPACE = "ryhavean_v3";

        // ─── DOM refs ───────────────────────────────────────────────────────
        const searchInput = document.getElementById('searchInput');
        const searchResultsDiv = document.getElementById('searchResults');
        const heartBtn = document.getElementById('heartBtn');
        const likeCountLabel = document.getElementById('likeCount');
        const mainArt = document.getElementById('mainArt');
        const songTitle = document.getElementById('songTitle');
        const artistName = document.getElementById('artistName');
        const progFill = document.getElementById('progFill');
        const curTime = document.getElementById('curTime');
        const durTime = document.getElementById('durTime');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const scrollContainer = document.getElementById('scrollContainer');
        const bgLayer = document.getElementById('bgLayer');
        const playBtn = document.getElementById('playBtn');

        // ─── Search (Debounced + CORS-safe) ────────────────────────────────
        let searchTimeout = null;
        let abortController = null;

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) {
                searchResultsDiv.style.display = 'none';
                return;
            }
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => performSearch(query), 350);
        });

        async function performSearch(query) {
            // Cancel previous request if still pending
            if (abortController) abortController.abort();
            abortController = new AbortController();

            searchResultsDiv.innerHTML = '<div class="search-loading">🔍 Axtarılır...</div>';
            searchResultsDiv.style.display = 'block';

            try {
                // Use a CORS proxy to avoid iTunes CORS issues
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const itunesUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=15`;
                
                let data;
                
                // Try direct first, fallback to proxy
                try {
                    const res = await fetch(itunesUrl, { signal: abortController.signal });
                    if (!res.ok) throw new Error('Direct fetch failed');
                    data = await res.json();
                } catch (directErr) {
                    // Fallback to CORS proxy
                    const proxyResponse = await fetch(proxyUrl + encodeURIComponent(itunesUrl), { signal: abortController.signal });
                    const text = await proxyResponse.text();
                    data = JSON.parse(text);
                }

                if (!data || !data.results || data.results.length === 0) {
                    searchResultsDiv.innerHTML = '<div class="search-empty">Nəticə tapılmadı 😕</div>';
                    return;
                }

                displaySearchResults(data.results);
            } catch (err) {
                if (err.name === 'AbortError') return;
                console.error("Axtarış xətası:", err);
                // Last resort: try with a different proxy
                try {
                    const fallbackProxy = 'https://corsproxy.io/?';
                    const fallbackUrl = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=15`;
                    const res = await fetch(fallbackProxy + encodeURIComponent(fallbackUrl), { signal: abortController.signal });
                    const text = await res.text();
                    const data = JSON.parse(text);
                    if (data && data.results && data.results.length > 0) {
                        displaySearchResults(data.results);
                        return;
                    }
                } catch (e2) {
                    if (e2.name === 'AbortError') return;
                }
                searchResultsDiv.innerHTML = '<div class="search-error">⚠️ Xəta baş verdi. Yenidən cəhd edin.</div>';
            }
        }

        function displaySearchResults(results) {
            searchResultsDiv.innerHTML = '';

            if (!results || results.length === 0) {
                searchResultsDiv.innerHTML = '<div class="search-empty">Nəticə tapılmadı 😕</div>';
                return;
            }

            results.forEach(item => {
                const div = document.createElement('div');
                div.className = 'search-item';

                // High-res cover
                const coverUrl = (item.artworkUrl100 || '')
                    .replace('100x100', '300x300')
                    .replace('100x100bb', '300x300bb');

                const trackName = item.trackName || 'Bilinməyən';
                const artist = item.artistName || 'Bilinməyən';
                const previewUrl = item.previewUrl || '';

                div.innerHTML = `
                    <img src="${item.artworkUrl60 || 'https://via.placeholder.com/44/333/666?text=♪'}" 
                         alt="" loading="lazy"
                         onerror="this.src='https://via.placeholder.com/44/333/666?text=♪'">
                    <div class="search-item-info">
                        <div class="search-item-title">${escapeHtml(trackName)}</div>
                        <div class="search-item-artist">${escapeHtml(artist)}</div>
                    </div>
                    <span class="search-item-badge">▶ ${item.trackTimeMillis ? Math.floor(item.trackTimeMillis / 1000 / 60) + 'dk' : ''}</span>
                `;

                div.onclick = () => {
                    if (!previewUrl) return;

                    const track = {
                        id: item.trackId || `track_${Date.now()}_${Math.random().toString(36).substr(2,5)}`,
                        title: trackName,
                        artist: artist,
                        cover: coverUrl || 'https://via.placeholder.com/600/282828/FFFFFF?text=♪',
                        url: previewUrl
                    };

                    addToQueueAndPlay(track);
                    searchResultsDiv.style.display = 'none';
                    searchInput.value = '';
                    searchInput.blur();
                };

                searchResultsDiv.appendChild(div);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ─── Queue & Play ──────────────────────────────────────────────────
        function addToQueueAndPlay(track) {
            // Check if already in queue
            const existingIdx = currentQueue.findIndex(t => t.id === track.id);
            if (existingIdx > -1) {
                currentIdx = existingIdx;
            } else {
                currentQueue.push(track);
                currentIdx = currentQueue.length - 1;
            }

            loadTrack(currentIdx);
            renderQueueList();

            // Auto-play with a small delay to allow loading
            setTimeout(() => {
                audio.play().catch(err => {
                    console.log("Auto-play可能需要用户交互:", err);
                    // Some browsers require user gesture - just show play button
                    syncPlayState(false);
                });
                syncPlayState(true);
            }, 100);
        }

        // ─── Like System ────────────────────────────────────────────────────
        async function fetchLikes(trackId) {
            const key = `track_${trackId}`;
            try {
                const response = await fetch(`https://api.countapi.xyz/get/${NAMESPACE}/${key}`);
                const data = await response.json();
                const count = data && typeof data.value === 'number' ? data.value : 0;
                likeCountLabel.textContent = count;
            } catch (e) {
                likeCountLabel.textContent = 0;
            }
        }

        async function toggleLike() {
            const track = currentQueue[currentIdx];
            if (!track) return;

            const key = `track_${track.id}`;

            if (!heartBtn.classList.contains('liked')) {
                heartBtn.classList.add('liked');
                try {
                    const response = await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${key}`);
                    const data = await response.json();
                    if (data && typeof data.value === 'number') {
                        likeCountLabel.textContent = data.value;
                    }
                } catch (e) {
                    const current = parseInt(likeCountLabel.textContent) || 0;
                    likeCountLabel.textContent = current + 1;
                }
            }
        }

        heartBtn.addEventListener('click', toggleLike);

        // ─── Load Track ────────────────────────────────────────────────────
        function loadTrack(idx) {
            const track = currentQueue[idx];
            if (!track) return;

            // Set audio source
            audio.src = track.url;
            audio.load();

            // Update UI immediately - album cover, title, artist
            mainArt.src = track.cover;
            mainArt.alt = track.title;
            songTitle.textContent = track.title;
            artistName.textContent = track.artist;

            // Reset like state and fetch likes
            heartBtn.classList.remove('liked');
            fetchLikes(track.id);

            // Dynamic background
            updateBackground(idx);
            updateActiveInList();
        }

        function updateBackground(idx) {
            const hue = (idx * 137.508) % 360;
            bgLayer.style.background = `linear-gradient(180deg, hsl(${hue}, 35%, 22%) 0%, #121212 100%)`;
        }

        // ─── Queue List ────────────────────────────────────────────────────
        function renderQueueList() {
            scrollContainer.innerHTML = '';
            if (currentQueue.length === 0) {
                scrollContainer.innerHTML = '<div style="padding:10px 24px;color:var(--text-secondary);font-size:13px;">Axtarış edin və mahnı əlavə edin</div>';
                return;
            }
            currentQueue.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `list-item ${i === currentIdx ? 'active' : ''}`;
                item.dataset.index = i;
                item.innerHTML = `<img class="item-thumb" src="${t.cover}" alt="${t.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/90/282828/666?text=♪'">`;
                item.onclick = () => {
                    currentIdx = i;
                    loadTrack(i);
                    setTimeout(() => {
                        audio.play().catch(() => {});
                        syncPlayState(true);
                    }, 100);
                };
                scrollContainer.appendChild(item);
            });
        }

        function updateActiveInList() {
            const items = scrollContainer.querySelectorAll('.list-item');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === currentIdx);
                if (i === currentIdx) {
                    item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            });
        }

        // ─── Playback Controls ─────────────────────────────────────────────
        function syncPlayState(isPlaying) {
            playIcon.classList.toggle('hidden', isPlaying);
            pauseIcon.classList.toggle('hidden', !isPlaying);
        }

        playBtn.onclick = () => {
            const track = currentQueue[currentIdx];
            if (!track) {
                // If nothing loaded, focus search
                searchInput.focus();
                return;
            }
            if (audio.paused) {
                audio.play().catch(err => {
                    console.log("Play hatası:", err);
                });
                syncPlayState(true);
            } else {
                audio.pause();
                syncPlayState(false);
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            if (currentQueue.length < 2) return;
            currentIdx = (currentIdx + 1) % currentQueue.length;
            loadTrack(currentIdx);
            setTimeout(() => {
                audio.play().catch(() => {});
                syncPlayState(true);
            }, 100);
        };

        document.getElementById('prevBtn').onclick = () => {
            if (currentQueue.length < 2) return;
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            currentIdx = (currentIdx - 1 + currentQueue.length) % currentQueue.length;
            loadTrack(currentIdx);
            setTimeout(() => {
                audio.play().catch(() => {});
                syncPlayState(true);
            }, 100);
        };

        // ─── Progress ──────────────────────────────────────────────────────
        audio.ontimeupdate = () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progFill.style.width = Math.min(pct, 100) + '%';
            }
            curTime.textContent = formatTime(audio.currentTime);
        };

        audio.onloadedmetadata = () => {
            durTime.textContent = formatTime(audio.duration);
            progFill.style.width = '0%';
            curTime.textContent = '0:00';
        };

        // Audio error handling
        audio.onerror = (e) => {
            console.warn("Audio load error, trying next track...", e);
            // If current track fails, try next one
            if (currentQueue.length > 1) {
                setTimeout(() => document.getElementById('nextBtn').click(), 500);
            }
        };

        document.getElementById('progRail').onclick = (e) => {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        };

        function formatTime(secs) {
            if (!secs || !isFinite(secs)) return '0:00';
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        audio.onended = () => {
            document.getElementById('nextBtn').click();
        };

        // ─── Close search ──────────────────────────────────────────────────
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                searchResultsDiv.style.display = 'none';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                searchResultsDiv.style.display = 'none';
                searchInput.blur();
            }
        });

        // ─── Init ──────────────────────────────────────────────────────────
        (async function init() {
            try {
                const res = await fetch('https://itunes.apple.com/search?term=trending&media=music&entity=song&limit=6');
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    currentQueue = data.results.map(item => ({
                        id: item.trackId || `init_${Date.now()}_${Math.random().toString(36).substr(2,5)}`,
                        title: item.trackName || 'Bilinməyən',
                        artist: item.artistName || 'Bilinməyən',
                        cover: (item.artworkUrl100 || '').replace('100x100', '300x300') || 'https://via.placeholder.com/600/282828/FFFFFF?text=♪',
                        url: item.previewUrl || ''
                    })).filter(t => t.url);

                    if (currentQueue.length > 0) {
                        loadTrack(0);
                        renderQueueList();
                    }
                }
            } catch (err) {
                console.error("Init error:", err);
                // Load with a fallback query
                try {
                    const res = await fetch('https://itunes.apple.com/search?term=pop&media=music&entity=song&limit=6');
                    const data = await res.json();
                    if (data.results && data.results.length > 0) {
                        currentQueue = data.results.map(item => ({
                            id: item.trackId || `init2_${Date.now()}_${Math.random().toString(36).substr(2,5)}`,
                            title: item.trackName || 'Bilinməyən',
                            artist: item.artistName || 'Bilinməyən',
                            cover: (item.artworkUrl100 || '').replace('100x100', '300x300') || 'https://via.placeholder.com/600/282828/FFFFFF?text=♪',
                            url: item.previewUrl || ''
                        })).filter(t => t.url);
                        if (currentQueue.length > 0) {
                            loadTrack(0);
                            renderQueueList();
                        }
                    }
                } catch (e2) {
                    console.log("Could not load initial tracks");
                }
            }
        })();
    </script>
</body>
</html>
